<header class="site-header">
  <a class="wordmark" routerLink="/" aria-label="Manga Whisper, home">
    <span class="wordmark-name">Manga Whisper</span>
    <span class="wordmark-tagline">Never miss a chapter release</span>
  </a>

  @if (isAdmin()) {
    <nav class="admin-nav" aria-label="Admin">
      <span class="admin-identity">
        <span class="admin-badge">Admin</span>
        <span class="admin-name">{{ adminName() }}</span>
      </span>
      @if (inAdminPanel()) {
        <a class="mw-btn" routerLink="/">Back to home</a>
      } @else {
        <a class="mw-btn mw-btn-primary" routerLink="/admin-panel">Admin panel</a>
      }
      <button type="button" class="mw-btn mw-btn-quiet" (click)="logout()">Sign out</button>
    </nav>
  } @else if (!onLoginPage()) {
    <nav class="admin-nav" aria-label="Account">
      <a class="mw-btn mw-btn-quiet" routerLink="/admin">Sign in</a>
    </nav>
  }
</header>
