<header class="site-header">
  <a class="wordmark" routerLink="/" aria-label="Manga Whisper, home">
    <span class="wordmark-name">Manga Whisper</span>
    <span class="wordmark-tagline">Never miss a chapter release</span>
  </a>

  @if (isAdmin()) {
    <nav class="admin-nav" aria-label="Admin">
      <span class="admin-name">Signed in as {{ adminName() }}</span>
      <a class="mw-btn" routerLink="/admin-panel" routerLinkActive="is-current" ariaCurrentWhenActive="page">
        Control panel
      </a>
      <button type="button" class="mw-btn mw-btn-quiet" (click)="logout()">Sign out</button>
    </nav>
  }
</header>
