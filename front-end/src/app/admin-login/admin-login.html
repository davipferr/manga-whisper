<section class="login mw-panel" aria-labelledby="login-heading">
  <div class="login-strip mw-screentone" aria-hidden="true"></div>

  <div class="login-body">
    <h1 id="login-heading">Sign in to the control panel</h1>
    <p class="mw-muted">Pause the chapter checker, fix the last known chapter and see what has been saved.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate class="login-form">
      <div class="mw-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          class="mw-input"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="showError('email')"
          aria-describedby="email-error"
        />
        @if (showError('email')) {
          <span id="email-error" class="mw-error">Enter the admin email.</span>
        }
      </div>

      <div class="mw-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          class="mw-input"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="showError('password')"
          aria-describedby="password-error"
        />
        @if (showError('password')) {
          <span id="password-error" class="mw-error">Enter the password.</span>
        }
      </div>

      @if (loginError(); as message) {
        <p class="mw-error" role="alert">{{ message }}</p>
      }

      <button type="submit" class="mw-btn mw-btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Signing in' : 'Sign in' }}
      </button>
    </form>
  </div>
</section>
